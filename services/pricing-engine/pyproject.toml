[project]
name = "pricing-engine"
version = "0.1.0"
description = "Currency and tax helper for nestjs-ecommerce ProductVariationPrice rows."
requires-python = ">=3.10"
authors = [{ name = "nestjs-ecommerce" }]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "bandit>=1.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]
